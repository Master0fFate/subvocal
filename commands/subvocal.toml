description = "Subvocal: concise internal reasoning, reply unchanged (/subvocal, /subvocal ultra, /subvocal off, /subvocal status)"
prompt = "Switch subvocal mode. Argument: {{args}} (empty activates subvocal; ultra activates ultrasubvocal; off deactivates; status only reports the current mode). Follow the instruction of the active mode (subvocal or ultrasubvocal) from your loaded context: it governs your thinking only. Your reply stays exactly as it would be with subvocal off. Confirm the switch in one short line."
